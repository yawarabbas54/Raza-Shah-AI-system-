<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Raza Shah AI</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="logo">RS</div>
        <div>
          <h1>Raza Shah AI</h1>
          <span>Personal AI Assistant</span>
        </div>
      </div>

      <button class="new-chat" onclick="newChat()">＋ New Chat</button>

      <nav>
        <p class="label">Workspace</p>
        <button class="nav-item active">⌂ <span>AI Assistant</span></button>
        <button class="nav-item">✦ <span>Explore Skills</span></button>
        <button class="nav-item">◈ <span>Projects</span></button>
      </nav>

      <div class="sidebar-bottom">
        <div class="status"><i></i> System Online</div>
        <div class="mini">Raza Shah AI v1.0</div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <span class="eyebrow">INTELLIGENT WORKSPACE</span>
          <h2>Raza Shah AI</h2>
        </div>
        <div class="top-actions">
          <button title="Settings">⚙</button>
          <div class="avatar">RS</div>
        </div>
      </header>

      <section class="chat-area" id="chatArea">
        <div class="welcome" id="welcome">
          <div class="orb"><span>✦</span></div>
          <p class="hello">WELCOME BACK</p>
          <h3>How can I help you today?</h3>
          <p class="sub">Ask Raza Shah AI to explain, create, plan, code, research, or solve.</p>

          <div class="quick-grid">
            <button onclick="usePrompt('Explain a difficult topic step by step')"><b>◉</b><span>Explain something</span><small>Learn with simple steps</small></button>
            <button onclick="usePrompt('Create a study plan for me')"><b>⌁</b><span>Create a plan</span><small>Organize your work</small></button>
            <button onclick="usePrompt('Help me write C++ code')"><b>&lt;/&gt;</b><span>Write code</span><small>Build and debug ideas</small></button>
            <button onclick="usePrompt('Give me ideas for my project')"><b>✦</b><span>Generate ideas</span><small>Turn ideas into projects</small></button>
          </div>
        </div>
      </section>

      <footer class="composer-wrap">
        <div class="composer">
          <textarea id="prompt" rows="1" placeholder="Message Raza Shah AI..." onkeydown="handleKey(event)"></textarea>
          <button class="send" onclick="sendMessage()" aria-label="Send">➤</button>
        </div>
        <div class="hint">Raza Shah AI can make mistakes. Check important information.</div>
      </footer>
    </main>
  </div>

<script>
const promptBox = document.getElementById("prompt");
const chatArea = document.getElementById("chatArea");
const welcome = document.getElementById("welcome");

function usePrompt(text){
  promptBox.value = text;
  promptBox.focus();
}

function handleKey(e){
  if(e.key === "Enter" && !e.shiftKey){
    e.preventDefault();
    sendMessage();
  }
}

function sendMessage(){
  const text = promptBox.value.trim();
  if(!text) return;
  if(welcome) welcome.style.display = "none";

  const user = document.createElement("div");
  user.className = "message user-message";
  user.innerHTML = `<div class="message-avatar">RS</div><div><div class="message-name">You</div><div class="bubble">${escapeHtml(text)}</div></div>`;
  chatArea.appendChild(user);

  const assistant = document.createElement("div");
  assistant.className = "message ai-message";
  assistant.innerHTML = `<div class="message-avatar ai">✦</div><div><div class="message-name">Raza Shah AI</div><div class="bubble ai-bubble">Hello! I'm ready to help. Connect your AI backend/API to turn this interface into a fully functional assistant.</div></div>`;
  chatArea.appendChild(assistant);

  promptBox.value = "";
  chatArea.scrollTop = chatArea.scrollHeight;
}

function newChat(){
  chatArea.innerHTML = "";
  location.reload();
}

function escapeHtml(str){
  return str.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
}
</script>
</body>
</html>
